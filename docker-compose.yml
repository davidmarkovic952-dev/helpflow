services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?postavi POSTGRES_PASSWORD}
      POSTGRES_DB: helpflow
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  migrate:
    build: .
    command: ["node", "-e", "import('./server/dist/db/migrate.js').then(m => m.migrate(process.env.DATABASE_ADMIN_URL, process.env.APP_DB_PASSWORD))"]
    environment:
      DATABASE_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/helpflow
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?postavi APP_DB_PASSWORD}
    depends_on: { db: { condition: service_healthy } }
  app:
    build: .
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://helpflow_app:${APP_DB_PASSWORD}@db:5432/helpflow
    depends_on: { migrate: { condition: service_completed_successfully } }
volumes: { pgdata: {} }
